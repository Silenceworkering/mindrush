<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MindRush</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f5f5ff;background:#0a0d19}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -15%,#4c2b8344,transparent 55%),#0a0d19;min-height:100vh}main{max-width:560px;margin:auto;padding:28px 19px 110px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:850;letter-spacing:-1.2px}.brand b{color:#a58cff}.chip{background:#ffffff0b;border:1px solid #ffffff15;border-radius:18px;padding:10px 13px;font-size:14px}.muted{color:#a1a5c0}.small{font-size:12px}.hero{margin:26px 0 20px;background:linear-gradient(135deg,#3c2669,#1c1e40 65%,#15253b);border:1px solid #8c72f744;border-radius:25px;padding:24px;box-shadow:0 16px 45px #0004;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:18px;top:10px;font-size:90px;color:#b6a0ff15}.hero h1{font-size:27px;letter-spacing:-.9px;margin:8px 0}.hero p{font-size:14px;color:#c6c4e5;line-height:1.5;max-width:270px}.btn{background:linear-gradient(120deg,#9169f5,#7152db);color:white;border:0;border-radius:15px;padding:14px 17px;font-size:14px;font-weight:750;cursor:pointer;box-shadow:0 8px 25px #7a55ef35}.btn:disabled{opacity:.45}.secondary{background:#ffffff0b;box-shadow:none;border:1px solid #ffffff18}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#ffffff08;border:1px solid #ffffff13;border-radius:20px;padding:17px;backdrop-filter:blur(15px)}.card h3{font-size:16px;margin:7px 0}.card p{font-size:13px;color:#a9aec7;line-height:1.5}.section{font-size:18px;font-weight:750;margin:24px 0 13px}.stat{font-size:25px;font-weight:800;margin:8px 0}.accent{color:#ad92ff}.nav{position:fixed;bottom:0;left:0;right:0;background:#111426ed;backdrop-filter:blur(20px);border-top:1px solid #ffffff14;display:flex;justify-content:space-around;padding:12px 5px max(14px,env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:#9a9bb5;font-size:12px;display:grid;gap:5px;justify-items:center}.nav button.active{color:#b69bff}.nav span{font-size:21px}.option{display:block;width:100%;text-align:left;margin:10px 0;padding:17px;border-radius:15px;background:#ffffff0a;border:1px solid #ffffff20;color:white;font-size:15px}.option:disabled{opacity:.6}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{border-radius:20px;background:#a58cff20;color:#bca9ff;padding:6px 10px;font-size:12px}.difficulty{display:flex;gap:7px;flex-wrap:wrap}.difficulty button{padding:11px 12px;border:1px solid #ffffff20;background:#ffffff0a;border-radius:12px;color:#ddd}.difficulty button.active{background:#7b57e9;border-color:#987bff;color:white}.toast{position:fixed;bottom:90px;left:15px;right:15px;max-width:500px;margin:auto;background:#27213e;border:1px solid #8d6af6;border-radius:14px;padding:14px;text-align:center;z-index:5}.empty{text-align:center;padding:35px 15px}.premium{background:linear-gradient(135deg,#302049,#1c2442);border:1px solid #795bc85e}.leader{padding:13px 0;border-bottom:1px solid #ffffff12}.leader:last-child{border:0}
</style></head><body><main><header class="top"><div class="brand">✦ Mind<span class="accent">Rush</span></div><div class="chip" id="balance">🧠 0 N</div></header><div id="screen"></div></main><nav class="nav" id="nav"></nav><script>
const T=window.Telegram?.WebApp;T?.ready();T?.expand();let me=null,tab='home',difficulty='normal',match=null,locked=false;
const init=T?.initData||'';const $=s=>document.querySelector(s);
async function api(path,method='GET',body){const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':init},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');return j}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3000)}
async function refresh(){me=await api('/me');$('#balance').textContent='🧠 '+me.coins+' N'}
function nav(){const names=[['home','⌂','Главная'],['play','◈','Играть'],['rating','♛','Рейтинг'],['profile','◉','Профиль']];$('#nav').innerHTML=names.map(([id,ic,label])=>'<button class="'+(tab===id?'active':'')+'" onclick="go(\''+id+'\')"><span>'+ic+'</span>'+label+'</button>').join('')}
async function go(t){tab=t;match=null;nav();try{await refresh();render()}catch(e){toast(e.message)}}
const until=(date,h)=>!date||Date.now()-new Date(date).getTime()>=h;
function render(){nav();if(tab==='home')$('#screen').innerHTML='<section class="hero"><span class="pill">🧠 Игра для тех, кто думает</span><h1>Прокачай свой интеллект</h1><p>Отвечай на вопросы, набирай опыт и поднимайся в рейтинге.</p><button class="btn" onclick="go(\'play\')">Начать игру →</button></section><div class="grid"><div class="card"><div class="muted small">Твой опыт</div><div class="stat">⚡ '+me.xp+' XP</div><span class="pill">Уровень '+(Math.floor(me.xp/300)+1)+'</span></div><div class="card"><div class="muted small">Нейроны</div><div class="stat">🧠 '+me.coins+'</div><span class="pill">Игровая валюта</span></div></div><div class="section">Твои награды</div><div class="card row"><div><b>🎁 Ежедневная награда</b><p>100 нейронов раз в 24 часа</p></div><button class="btn" '+(!until(me.daily_claim_at,86400000)?'disabled':'')+' onclick="claim(\'daily\')">Забрать</button></div><div style="height:12px"></div><div class="card row"><div><b>✦ Premium-награда</b><p>75 нейронов каждые 3 часа</p></div><button class="btn" '+(!(me.premium_until&&new Date(me.premium_until)>new Date()&&until(me.premium_claim_at,10800000))?'disabled':'')+' onclick="claim(\'premium\')">Забрать</button></div>';
else if(tab==='play')$('#screen').innerHTML='<div class="section">Выбери сложность</div><div class="difficulty">'+[['easy','Лёгкий'],['normal','Средний'],['hard','Сложный'],['expert','Эксперт']].map(([v,l])=>'<button class="'+(difficulty===v?'active':'')+'" onclick="difficulty=\''+v+'\';render()">'+l+'</button>').join('')+'</div><div class="hero"><span class="pill">⚡ Соло-викторина</span><h1>Проверь свои знания</h1><p>5 вопросов, ограничение времени и XP за правильные ответы.</p><button class="btn" onclick="start()">Начать викторину →</button></div><div class="grid"><div class="card"><h3>⚔️ Дуэли</h3><p>Соревнования между игроками — в разработке.</p></div><div class="card"><h3>🏆 Турниры</h3><p>Турнирная сетка и призы — скоро.</p></div></div>';
else if(tab==='profile')$('#screen').innerHTML='<div class="hero premium"><span class="pill">✦ MindRush Premium</span><h1>49 ⭐ / 30 дней</h1><p>75 нейронов каждые 3 часа по кнопке, расширенные возможности и будущие эксклюзивные режимы.</p><button class="btn" onclick="buy()">Оформить Premium ⭐</button></div><div class="section">Мой профиль</div><div class="card"><div class="stat">'+escapeHtml(me.username)+'</div><p>Опыт: '+me.xp+' XP</p><p>Баланс: '+me.coins+' N</p><p>Premium: '+(me.premium_until&&new Date(me.premium_until)>new Date()?'до '+new Date(me.premium_until).toLocaleDateString('ru-RU'):'не активен')+'</p></div>';
else if(tab==='rating'){ $('#screen').innerHTML='<div class="section">🏆 Рейтинг игроков</div><div class="card" id="leaders">Загрузка...</div>';api('/leaderboard').then(a=>$('#leaders').innerHTML=a.map((p,i)=>'<div class="row leader"><b>'+(i+1)+'. '+escapeHtml(p.username)+'</b><span class="accent">'+p.xp+' XP</span></div>').join('')||'<p class="muted">Пока нет игроков</p>').catch(e=>toast(e.message))}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function claim(k){try{const r=await api('/claim/'+k,'POST');toast('Получено +'+r.amount+' N');await refresh();render()}catch(e){toast(e.message)}}
async function buy(){try{if(!T?.openInvoice)throw Error('Откройте приложение через Telegram');const r=await api('/premium/invoice','POST');T.openInvoice(r.url,async()=>{await refresh();render()})}catch(e){toast(e.message)}}
async function start(){try{const r=await api('/solo/start','POST',{difficulty});match=r.id;await question()}catch(e){toast(e.message)}}
async function question(){try{const r=await api('/solo/'+match);if(r.finished){finish(r);return}$('#screen').innerHTML='<div class="section">Вопрос '+(r.index+1)+' из '+r.total+'</div><div class="card"><span class="pill">⏱ '+r.seconds+' сек. на ответ</span><h2 style="font-size:22px;line-height:1.4">'+escapeHtml(r.question.question)+'</h2>'+r.question.options.map((o,i)=>'<button class="option" onclick="answer('+i+')">'+escapeHtml(o)+'</button>').join('')+'</div>';locked=false}catch(e){toast(e.message)}}
async function answer(n){if(locked)return;locked=true;document.querySelectorAll('.option').forEach(b=>b.disabled=true);try{const r=await api('/solo/'+match+'/answer','POST',{answer:n});toast(r.correct?'Верно! +1 балл':'Неверный ответ');if(r.finished){setTimeout(()=>finish(r),550)}else setTimeout(question,550)}catch(e){toast(e.message)}}
function finish(r){$('#screen').innerHTML='<div class="hero"><span class="pill">Викторина завершена</span><h1>'+r.score+' из 5 правильных</h1><p>Заработано '+r.reward+' XP. Возвращайся за новыми вопросами!</p><button class="btn" onclick="go(\'play\')">Играть снова</button></div>';refresh().catch(()=>{})}
(async()=>{try{await refresh();render()}catch(e){$('#screen').innerHTML='<div class="empty"><h2>🧠 MindRush</h2><p class="muted">'+escapeHtml(e.message)+'</p><p>Открой игру из Telegram-бота.</p></div>'}})();
</script></body></html>
